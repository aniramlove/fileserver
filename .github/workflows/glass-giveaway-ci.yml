name: Glass Giveaway CI

on:
  push:
    paths:
      - "glass-giveaway-bot/**"
      - ".github/workflows/glass-giveaway-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glass-giveaway-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glass-giveaway-bot/package.json
      - run: npm install
      - name: Check Serverless JavaScript syntax\n        run: find tgcloud -name '*.js' -print0 | xargs -0 -n1 node --check\n      - run: npm run build
