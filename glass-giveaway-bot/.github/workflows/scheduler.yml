name: Giveaway scheduler\non:\n  schedule:\n    - cron: "7 * * * *"\n  workflow_dispatch:\nconcurrency:\n  group: giveaway-scheduler\n  cancel-in-progress: false\njobs:\n  run-scheduler:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm install\n      - name: Run scheduler\n        env:\n          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}\n        run: npx tgcloud run endpoints/processSchedule '{}'\n